        isRead: true

    # ---- GraphQL ------------------------------------------------------------
    GraphQLRequest:
      type: object
      description: Standard GraphQL-over-HTTP request body.
      required: [query]
      properties:
        query:
          type: string
          description: GraphQL document.
          example: 'query ListBankAccount { listBankAccount { id bankName isDeleted } }'
        variables:
          type: object
          additionalProperties: true
          nullable: true
          example: {}
        operationName:
          type: string
          nullable: true
          example: ListBankAccount
      example:
        operationName: ListBankAccount
        query: 'query ListBankAccount { listBankAccount { id bankName isDeleted } }'
    GraphQLBankAccount:
      type: object
      description: |
        The GraphQL `BankAccount` type (all fields nullable except `id`;
        timestamps are plain strings - ISO for seeded rows, epoch milliseconds
        for rows created after start-up).
      required: [id]
      properties:
        id: { type: string, example: pgl34JtnfhX }
        uuid: { type: string, nullable: true, example: 0939b3fe-02da-46f4-a3a6-f06f0fc49f75 }
        userId: { type: string, nullable: true, example: uBmeaz5pX }
        bankName: { type: string, nullable: true, example: "Waters, King and O'Reilly Bank" }
        accountNumber: { type: string, nullable: true, example: '7774132232' }
        routingNumber: { type: string, nullable: true, example: '996645387' }
        isDeleted: { type: boolean, nullable: true, example: false }
        createdAt: { type: string, nullable: true, example: '2023-03-28T21:55:07.857Z' }
        modifiedAt: { type: string, nullable: true, example: '2024-03-07T20:50:34.541Z' }
      example:
        id: pgl34JtnfhX
        uuid: 0939b3fe-02da-46f4-a3a6-f06f0fc49f75
        userId: uBmeaz5pX
        bankName: Waters, King and O'Reilly Bank
        accountNumber: '7774132232'
        routingNumber: '996645387'
        isDeleted: false
        createdAt: '2023-03-28T21:55:07.857Z'
        modifiedAt: '2024-03-07T20:50:34.541Z'
    GraphQLError:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: Cannot query field "nope" on type "Query".
        locations:
          type: array
          items:
            type: object
            properties:
              line: { type: integer, example: 1 }
              column: { type: integer, example: 9 }
        path:
          type: array
          items:
            oneOf:
              - type: string
              - type: integer
          example: [listBankAccount]
        extensions:
          type: object
          additionalProperties: true
      example:
        message: "TypeError: Cannot read properties of undefined (reading 'id')"
        locations:
          - { line: 1, column: 25 }
        path: [listBankAccount]
    GraphQLResponse:
      type: object
      description: |
        GraphQL response envelope. `data` holds one key per root field you
        selected, e.g. `{"listBankAccount": [GraphQLBankAccount]}`,
        `{"createBankAccount": GraphQLBankAccount}` or
        `{"deleteBankAccount": true}`. `errors` is present when something
        failed (possibly alongside partial `data`).
      properties:
        data:
          type: object
          nullable: true
          properties:
            listBankAccount:
              type: array
              nullable: true
              items:
                $ref: '#/components/schemas/GraphQLBankAccount'
            createBankAccount:
              anyOf:
                - $ref: '#/components/schemas/GraphQLBankAccount'
                - $ref: '#/components/schemas/NullValue'
            deleteBankAccount:
              type: boolean
              nullable: true
        errors:
          type: array
          items:
            $ref: '#/components/schemas/GraphQLError'
      example:
        data:
          listBankAccount:
            - id: pgl34JtnfhX
              bankName: Waters, King and O'Reilly Bank
              isDeleted: false
